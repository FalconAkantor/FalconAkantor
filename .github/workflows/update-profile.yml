name: Actualizar animaciones del perfil

on:
  schedule:
    - cron: "17 5 * * *" # cada día a las 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/ascii.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Solo Python estándar: no se instala nada.
      - name: Descargar el calendario de contribuciones
        run: python3 scripts/fetch_contributions.py

      - name: Generar los SVG
        run: python3 scripts/render_profile.py

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg data/contributions.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar animaciones del perfil [skip ci]"
            git push
          fi
